<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streak Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2330a14e'/></svg>">
<style>
:root{--bg:#f6f8fa;--card:#fff;--text:#1f2328;--mute:#656d76;--line:#d0d7de;--l0:#ebedf0;--l1:#9be9a8;--l2:#40c463;--l3:#30a14e;--l4:#216e39;--pend:#e8912d;--sel:#1f2328}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--mute:#8b949e;--line:#30363d;--l0:#21262d;--l1:#0e4429;--l2:#006d32;--l3:#26a641;--l4:#39d353;--pend:#f0a04b;--sel:#e6edf3}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:920px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.sub{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.2}.stat span{color:var(--mute);font-size:13px}
.heat-wrap{overflow-x:auto;padding-bottom:6px}
.months{position:relative;height:16px;font-size:11px;color:var(--mute);margin-left:0}
.months span{position:absolute}
.grid{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;width:max-content}
.cell{width:12px;height:12px;border-radius:2px;background:var(--l0);cursor:pointer;border:0;padding:0}
.cell[data-l="1"]{background:var(--l1)}.cell[data-l="2"]{background:var(--l2)}.cell[data-l="3"]{background:var(--l3)}.cell[data-l="4"]{background:var(--l4)}
.cell.future{visibility:hidden}.cell.sel{outline:2px solid var(--sel);outline-offset:1px}
.cell:focus-visible{outline:2px solid #0969da;outline-offset:1px}
.legend{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--l0)}
.bar div{transition:width .4s}.bar .d{background:var(--l3)}.bar .p{background:var(--pend)}
.barlbl{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;flex-wrap:wrap;gap:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.nav h2{margin:0;flex:1}
button.b{font:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button.b:hover{background:var(--l0)}
form{display:flex;gap:8px;margin-bottom:12px}
input[type=text]{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);min-width:0}
input[type=text]:focus{outline:2px solid var(--l3);border-color:transparent}
button.go{font:inherit;background:var(--l3);color:#fff;border:0;border-radius:6px;padding:8px 16px;cursor:pointer;font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li input{width:18px;height:18px;accent-color:var(--l3);cursor:pointer;flex:none}
li .t{flex:1;word-break:break-word}li.done .t{text-decoration:line-through;color:var(--mute)}
.tag{font-size:12px;color:var(--pend);white-space:nowrap}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}.x:hover{color:#cf222e}
.empty{color:var(--mute);padding:8px 4px}
.sec{margin-top:18px;font-size:13px;color:var(--pend);font-weight:600}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Streak Tracker</h1><span class="sub" id="todayLbl"></span></div>

  <div class="stats">
    <div class="stat"><b id="sToday">0</b><span>done today</span></div>
    <div class="stat"><b id="sStreak">0</b><span>day streak</span></div>
    <div class="stat"><b id="sBest">0</b><span>best streak</span></div>
    <div class="stat"><b id="sDays">0</b><span>active days</span></div>
  </div>

  <section class="card">
    <h2 id="heatTitle">Activity</h2>
    <div class="heat-wrap" id="heatWrap"><div class="months" id="months"></div><div class="grid" id="grid"></div></div>
    <div class="legend">Less <i style="background:var(--l0)"></i><i style="background:var(--l1)"></i><i style="background:var(--l2)"></i><i style="background:var(--l3)"></i><i style="background:var(--l4)"></i> More</div>
  </section>

  <section class="card">
    <h2>All-time progress</h2>
    <div class="bar"><div class="d" id="barD"></div><div class="p" id="barP"></div></div>
    <div class="barlbl">
      <span><span class="dot" style="background:var(--l3)"></span><b id="tDone">0</b> completed</span>
      <span><span class="dot" style="background:var(--pend)"></span><b id="tPend">0</b> pending</span>
      <span class="sub" id="tUp"></span>
    </div>
  </section>

  <section class="card">
    <div class="nav">
      <h2 id="dayTitle"></h2>
      <button class="b" id="prev" aria-label="Previous day">‹</button>
      <button class="b" id="todayBtn">Today</button>
      <button class="b" id="next" aria-label="Next day">›</button>
    </div>
    <form id="form"><input type="text" id="title" placeholder="Add a task for this day" maxlength="200" autocomplete="off"><button class="go">Add task</button></form>
    <ul id="list"></ul>
    <div id="carriedWrap" hidden><div class="sec">Pending from earlier days</div><ul id="carried"></ul></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => new Date(s + 'T00:00:00');
const shift = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
let today = fmt(new Date()), sel = today, stats = null;

const api = async (url, opt) => { const r = await fetch(url, opt && { headers: { 'Content-Type': 'application/json' }, ...opt }); return r.json(); };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const level = (c) => (c >= 6 ? 4 : c >= 4 ? 3 : c >= 2 ? 2 : c >= 1 ? 1 : 0);
const nice = (s, o) => parse(s).toLocaleDateString(undefined, o);

async function load() {
  const now = fmt(new Date());
  if (now !== today) { if (sel === today) sel = now; today = now; } // handles midnight rollover
  [stats] = await Promise.all([api(`/api/stats?today=${today}`)]);
  drawStats(); drawHeat(); await drawDay();
}

function drawStats() {
  $('todayLbl').textContent = nice(today, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  $('sToday').textContent = stats.todayDone; $('sStreak').textContent = stats.streak;
  $('sBest').textContent = stats.best; $('sDays').textContent = stats.activeDays;
  const total = stats.totalDone + stats.pending;
  $('barD').style.width = total ? (stats.totalDone / total) * 100 + '%' : '0';
  $('barP').style.width = total ? (stats.pending / total) * 100 + '%' : '0';
  $('tDone').textContent = stats.totalDone; $('tPend').textContent = stats.pending;
  $('tUp').textContent = stats.upcoming ? `${stats.upcoming} scheduled for later` : '';
}

function drawHeat() {
  const grid = $('grid'), months = $('months'); grid.innerHTML = ''; months.innerHTML = '';
  const end = parse(today), start = new Date(end); start.setDate(start.getDate() - 52 * 7 - end.getDay());
  let total = 0, lastMonth = -1, col = 0;
  for (let d = new Date(start), i = 0; ; d.setDate(d.getDate() + 1), i++) {
    if (d.getDay() === 0) { col = Math.floor(i / 7); if (d.getMonth() !== lastMonth && d.getDate() <= 7) { const s = document.createElement('span'); s.style.left = col * 15 + 'px'; s.textContent = d.toLocaleDateString(undefined, { month: 'short' }); months.appendChild(s); } lastMonth = d.getMonth(); }
    const ds = fmt(d), c = stats.heat[ds] || 0, b = document.createElement('button');
    b.className = 'cell' + (ds > today ? ' future' : '') + (ds === sel ? ' sel' : '');
    b.dataset.l = level(c); b.title = `${c} task${c === 1 ? '' : 's'} completed on ${nice(ds, { day: 'numeric', month: 'short', year: 'numeric' })}`;
    b.setAttribute('aria-label', b.title); total += c;
    b.onclick = () => { sel = ds; drawHeat(); drawDay(); };
    grid.appendChild(b);
    if (ds === today) break;
  }
  $('heatTitle').textContent = `${total} task${total === 1 ? '' : 's'} completed in the last year`;
  const w = $('heatWrap'); w.scrollLeft = w.scrollWidth;
}

function row(t, carried) {
  const li = document.createElement('li'); li.className = t.done ? 'done' : '';
  const age = carried ? Math.round((parse(today) - parse(t.due_date)) / 864e5) : 0;
  li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''} aria-label="Complete task"><span class="t">${esc(t.title)}</span>${carried ? `<span class="tag">${age === 1 ? 'yesterday' : age + ' days ago'}</span>` : ''}<button class="x" aria-label="Delete task">×</button>`;
  li.querySelector('input').onchange = async (e) => { await api(`/api/tasks/${t.id}`, { method: 'PATCH', body: JSON.stringify({ done: e.target.checked, today }) }); load(); };
  li.querySelector('.x').onclick = async () => { await api(`/api/tasks/${t.id}`, { method: 'DELETE' }); load(); };
  return li;
}

async function drawDay() {
  const { tasks, carried } = await api(`/api/day?date=${sel}&today=${today}`);
  $('dayTitle').textContent = sel === today ? 'Today' : nice(sel, { weekday: 'long', day: 'numeric', month: 'long' });
  $('todayBtn').hidden = sel === today;
  const list = $('list'); list.innerHTML = '';
  if (!tasks.length) list.innerHTML = `<li class="empty">${sel === today ? 'Nothing planned yet. Add your first task above.' : 'No tasks planned for this day.'}</li>`;
  tasks.forEach((t) => list.appendChild(row(t, false)));
  $('carriedWrap').hidden = !carried.length;
  const c = $('carried'); c.innerHTML = ''; carried.forEach((t) => c.appendChild(row(t, true)));
}

$('form').onsubmit = async (e) => {
  e.preventDefault(); const v = $('title').value.trim(); if (!v) return;
  $('title').value = ''; await api('/api/tasks', { method: 'POST', body: JSON.stringify({ title: v, date: sel }) }); load();
};
$('prev').onclick = () => { sel = shift(sel, -1); drawHeat(); drawDay(); };
$('next').onclick = () => { sel = shift(sel, 1); drawHeat(); drawDay(); };
$('todayBtn').onclick = () => { sel = today; drawHeat(); drawDay(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
